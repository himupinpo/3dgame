<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>将棋（2D・オンライン対局）</title>
<style>
:root{--cs:40px;--bg:#f2eee4;--ink:#1c1a16;--sub:#6d665a;--board:#e4cd98;--line:#3b3222;--koma:#f5e7c6;--komaLine:#6b5a3c;--red:#b3241b;--btn:#fffdf8;--btnLine:#c9c0ae}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100%;display:grid;justify-content:center;align-content:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 8px calc(env(safe-area-inset-bottom,0px) + 8px);
  grid-template-areas:"top" "board" "bot" "bar"}
body.emb #app{padding-top:calc(env(safe-area-inset-top,0px) + 48px)}
body.land #app{grid-template-areas:"top board bot" "top bar bot";grid-template-columns:auto auto auto;align-items:start;column-gap:14px}
.side{grid-area:top;border:1px solid transparent;border-radius:6px;padding:4px 6px}
#p0{grid-area:bot}
body.land #p1{align-self:start}body.land #p0{align-self:end}
body.land .side{width:calc(var(--cs) * 3.9)}
.side.on{border-color:var(--line);background:#fffaf0}
.who{font-size:14px;color:var(--sub);display:flex;justify-content:space-between;gap:8px}
.side.on .who{color:var(--ink);font-weight:bold}
.hand{display:flex;flex-wrap:wrap;gap:2px;min-height:calc(var(--cs) * 1.15);align-items:center;margin-top:2px}
.hk{position:relative;width:calc(var(--cs) * 1.08);height:calc(var(--cs) * 1.08);border:0;background:none;padding:0;border-radius:4px}
.hk.sel{background:#e9c35c}
.hk svg{width:100%;height:100%;display:block}
.hk b{position:absolute;right:-1px;bottom:-2px;font-size:calc(var(--cs) * .34);font-family:system-ui,sans-serif;font-weight:bold;color:var(--ink);background:var(--bg);border-radius:3px;padding:0 2px;line-height:1.1}
body.face #p1{transform:rotate(180deg)}body.face #p1 .hk.g svg{transform:none}
#bw{grid-area:board;display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;justify-content:center}
#files{display:grid;grid-template-columns:repeat(9,var(--cs));font-size:calc(var(--cs) * .3);color:var(--sub);text-align:center;font-family:system-ui,sans-serif;height:calc(var(--cs) * .42);line-height:calc(var(--cs) * .42)}
#ranks{display:grid;grid-template-rows:repeat(9,var(--cs));font-size:calc(var(--cs) * .3);color:var(--sub);width:calc(var(--cs) * .45);text-align:center;align-items:center;grid-column:2;grid-row:2}
#board{grid-column:1;grid-row:2;display:grid;grid-template-columns:repeat(9,var(--cs));grid-template-rows:repeat(9,var(--cs));background:var(--board);border:2px solid var(--line)}
.sq{position:relative;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.sq:nth-child(9n){border-right:0}.sq:nth-child(n+73){border-bottom:0}
.sq svg{position:absolute;inset:4%;width:92%;height:92%}
.sq.g svg,.hk.g svg{transform:rotate(180deg)}
.sq.last{background:#d7bb73}.sq.sel{background:#e9c35c}.sq.chk{background:#e59a8c}
.sq.tg::after{content:'';position:absolute;left:50%;top:50%;width:26%;height:26%;margin:-13% 0 0 -13%;border-radius:50%;background:#3d5a2c80;pointer-events:none}
.sq.tg.cap::after{width:84%;height:84%;margin:-42% 0 0 -42%;background:none;border:3px solid #3d5a2c99;box-sizing:border-box}
.dot{position:absolute;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:var(--line);pointer-events:none;z-index:1}
#bar{grid-area:bar;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;margin-top:2px}
#msg{flex-basis:100%;text-align:center;font-size:15px;min-height:1.4em}
#msg.chk{color:var(--red);font-weight:bold}
#bar button{background:var(--btn);border:1px solid var(--btnLine);border-radius:6px;padding:6px 10px;font-size:14px}
#bar button.on{background:#3b3222;border-color:#3b3222;color:#fff}
#bar button:disabled{opacity:.45;cursor:default}
body.land #bar{max-width:calc(var(--cs) * 9.5)}
.dlg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0003;z-index:5}
.dlg.on{display:flex}
.box{background:#fffdf8;border:1px solid var(--line);border-radius:8px;padding:16px 18px;text-align:center;min-width:220px;max-width:min(92vw,420px)}
.box p{margin:0 0 12px;font-size:17px}
.box button{background:var(--btn);border:1px solid var(--btnLine);border-radius:6px;padding:8px 16px;font-size:15px;margin:0 4px}
.box.flip{transform:rotate(180deg)}
#kifuList{max-height:55vh;overflow-y:auto;text-align:left;font-size:15px;line-height:1.7;margin:0 0 12px;padding:0 6px;user-select:text;-webkit-user-select:text}
/* オンライン対局：後手なら盤を回して自分の駒を手前に */
body.flipv #board{transform:rotate(180deg)}
body.flipv #app{grid-template-areas:"bot" "board" "top" "bar"}
body.flipv.land #app{grid-template-areas:"bot board top" "bot bar top"}
body.flipv.land #p1{align-self:end}body.flipv.land #p0{align-self:start}
body.flipv .hk svg{transform:rotate(180deg)}body.flipv .hk.g svg{transform:none}
.who b{font-weight:bold;color:var(--red);margin-left:4px}
#bar button#cpuBtn.on{background:#5a3a1c;border-color:#5a3a1c;color:#fff}
.crow{display:flex;gap:6px;justify-content:center;margin:6px 0;flex-wrap:wrap}.crow button.on{background:#3b3222!important;color:#fff;border-color:#3b3222!important}.csub{font-size:14px!important;margin:12px 0 2px!important;color:var(--sub)}
#bar button#netBtn.on{background:#2c5a2c;border-color:#2c5a2c;color:#fff}
.nbox{min-width:min(92vw,340px);font-family:system-ui,sans-serif}
.nState{font-size:13px;color:var(--sub);white-space:pre-line;margin:0 0 10px;text-align:left;line-height:1.6}
.nList{display:flex;flex-direction:column;gap:6px;max-height:30vh;overflow-y:auto;margin:0 0 10px}
.nRoom{text-align:left;background:var(--btn);border:1px solid var(--btnLine);border-radius:6px;padding:8px 10px;font-size:14px}
.nRoom:disabled{opacity:.5}
.nEmpty{font-size:13px;color:var(--sub);padding:6px}
.nRow{display:flex;align-items:center;gap:6px;margin:0 0 10px;font-size:14px;flex-wrap:wrap}
.nRow input{flex:1;min-width:0;font:inherit;font-size:15px;border:1px solid var(--btnLine);border-radius:6px;padding:6px 8px;background:#fff;-webkit-user-select:text;user-select:text}
#nCode{text-transform:uppercase;letter-spacing:.1em;max-width:110px}
.nRow button.on{background:#3b3222;border-color:#3b3222;color:#fff}
.box .nRow button{margin:0;padding:6px 10px;font-size:14px}
#kifuList div{display:flex;gap:10px}#kifuList i{font-style:normal;color:var(--sub);min-width:2.4em;text-align:right;font-family:system-ui,sans-serif;font-size:13px;line-height:1.95}
</style></head>
<body>
<div id="app">
 <div class="side" id="p1"><div class="who"><span>△ 後手<b id="n1"></b></span><span id="c1"></span></div><div class="hand" id="h1"></div></div>
 <div id="bw"><div id="files"></div><div></div><div id="board"></div><div id="ranks"></div></div>
 <div class="side" id="p0"><div class="who"><span>▲ 先手<b id="n0"></b></span><span id="c0"></span></div><div class="hand" id="h0"></div></div>
 <div id="bar"><div id="msg"></div><button id="undo">待った</button><button id="kifu">棋譜</button><button id="face" title="後手の持ち駒を反対向きにする（向かい合って遊ぶとき）">向かい合わせ</button><button id="cpuBtn">相手：ふたりで</button><button id="netBtn">オンライン対局</button><button id="to3d">3Dの盤へ</button><button id="resign">投了</button><button id="newg">最初から</button></div>
</div>
<div class="dlg" id="adlg"><div class="box"><p id="aMsg"></p><button id="aYes">はい</button><button id="aNo">やめる</button></div></div>
<div class="dlg" id="promo"><div class="box" id="promoBox"><p>成りますか？</p><button id="pYes">成る</button><button id="pNo">成らない</button></div></div>
<div class="dlg" id="over"><div class="box"><p id="overMsg"></p><button id="again">もう一局</button><button id="look">盤を見る</button></div></div>
<div class="dlg" id="ndlg"><div class="box nbox">
 <p>オンライン対局</p>
 <div id="nState" class="nState"></div>
 <div id="nOut">
  <div class="nRow">名前<input id="nName" maxlength="14" autocomplete="off" spellcheck="false"></div>
  <div id="nRooms" class="nList"></div>
  <div class="nRow">部屋番号<input id="nCode" maxlength="6" autocomplete="off" spellcheck="false" placeholder="AB12CD"><button id="nJoin">入る</button></div>
  <div class="nRow">部屋を作るとき、あなたは<button id="nPicks">先手</button><button id="nPickg">後手</button><button id="nPickr">おまかせ</button></div>
  <div style="margin-bottom:10px"><button id="nMake">部屋を作る</button><button id="nPerm">許可の設定を開く</button></div>
 </div>
 <div id="nIn"><p id="nRoomTxt" class="nState"></p><div style="margin-bottom:10px"><button id="nLeave">部屋を出る</button></div></div>
 <button id="nClose">とじる</button>
</div></div>
<div class="dlg" id="cdlg"><div class="box"><p>対局の相手</p>
 <div class="crow" id="cMode"><button data-v="0">ふたりで</button><button data-v="1">CPU</button></div>
 <div id="cOpt"><p class="csub">CPU の強さ</p><div class="crow" id="cLv"><button data-v="0">よわい</button><button data-v="1">ふつう</button><button data-v="2">つよい</button></div>
 <p class="csub">あなたは</p><div class="crow" id="cSide"><button data-v="0">▲先手</button><button data-v="1">△後手</button></div></div>
 <div style="margin-top:14px"><button id="cGo">この相手で、最初から</button><button id="cClose">とじる</button></div></div></div>
<div class="dlg" id="kdlg"><div class="box"><p>棋譜</p><div id="kifuList"></div><button id="kClose">とじる</button></div></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const CPU={on:false,side:1,lv:1,busy:false,req:0};   // CPU と対戦（side：CPU が指す側）
// ================= ルール =================
// 盤は B[段-1][9-筋]。o=0 が先手（下から上へ）、o=1 が後手
const NAME={FU:'歩',KY:'香',KE:'桂',GI:'銀',KI:'金',KA:'角',HI:'飛',OU:'玉'};
const PNAME={FU:'と',KY:'杏',KE:'圭',GI:'全',KA:'馬',HI:'龍'};            // 盤に出す成り駒の字
const KNAME={FU:'と',KY:'成香',KE:'成桂',GI:'成銀',KA:'馬',HI:'龍'};        // 棋譜の書き方
const HAND=['HI','KA','KI','GI','KE','KY','FU'];
const PROMOTABLE=new Set(['FU','KY','KE','GI','KA','HI']);
const ORTH=[[0,-1],[0,1],[-1,0],[1,0]],DIAG=[[-1,-1],[1,-1],[-1,1],[1,1]];
const STEP={FU:[[0,-1]],KE:[[-1,-2],[1,-2]],GI:[[-1,-1],[0,-1],[1,-1],[-1,1],[1,1]],KI:[[-1,-1],[0,-1],[1,-1],[-1,0],[1,0],[0,1]],OU:ORTH.concat(DIAG)};
const SLIDE={KY:[[0,-1]],KA:DIAG,HI:ORTH};
function vecs(p){if(p.pr){if(p.t==='KA')return[ORTH,DIAG];if(p.t==='HI')return[DIAG,ORTH];return[STEP.KI,[]]}return[STEP[p.t]||[],SLIDE[p.t]||[]]}
const inB=(r,c)=>r>=0&&r<9&&c>=0&&c<9;
// 駒がきいているマス（自分の駒があるマスはのぞく）
function reach(B,r,c){const p=B[r][c],s=p.o===0?1:-1,out=[],[st,sl]=vecs(p);
  for(const [dx,dy] of st){const a=r+dy*s,b=c+dx*s;if(inB(a,b)&&(!B[a][b]||B[a][b].o!==p.o))out.push([a,b])}
  for(const [dx,dy] of sl){let a=r+dy*s,b=c+dx*s;while(inB(a,b)){const q=B[a][b];if(q){if(q.o!==p.o)out.push([a,b]);break}out.push([a,b]);a+=dy*s;b+=dx*s}}
  return out}
function attacked(B,r,c,by){for(let i=0;i<9;i++)for(let j=0;j<9;j++){const p=B[i][j];if(p&&p.o===by)for(const [a,b] of reach(B,i,j))if(a===r&&b===c)return true}return false}
function kingAt(B,o){for(let i=0;i<9;i++)for(let j=0;j<9;j++){const p=B[i][j];if(p&&p.o===o&&p.t==='OU')return[i,j]}return null}
function inCheck(S,o){const k=kingAt(S.B,o);return !!k&&attacked(S.B,k[0],k[1],1-o)}
const copy=S=>({B:S.B.map(row=>row.map(x=>x&&{t:x.t,o:x.o,pr:x.pr})),H:[Object.assign({},S.H[0]),Object.assign({},S.H[1])],turn:S.turn});
function doMove(S,m){const N=copy(S),o=S.turn;
  if(m.drop){N.B[m.tr][m.tc]={t:m.drop,o,pr:false};if(!--N.H[o][m.drop])delete N.H[o][m.drop]}
  else{const p=N.B[m.fr][m.fc],cap=N.B[m.tr][m.tc];if(cap)N.H[o][cap.t]=(N.H[o][cap.t]||0)+1;N.B[m.fr][m.fc]=null;if(m.pro)p.pr=true;N.B[m.tr][m.tc]=p}
  N.turn=1-o;return N}
const far=(o,r)=>o===0?r:8-r;                       // 相手陣の奥からの距離（0=いちばん奥）
const zone=(o,r)=>far(o,r)<=2;
const mustPro=(p,tr)=>!p.pr&&((p.t==='FU'||p.t==='KY')&&far(p.o,tr)===0||p.t==='KE'&&far(p.o,tr)<=1);
const canPro=(p,fr,tr)=>!p.pr&&PROMOTABLE.has(p.t)&&(zone(p.o,fr)||zone(p.o,tr));
// 盤の駒の合法手（動かしたあと自分の玉が取られないもの）
function movesFrom(S,r,c){const p=S.B[r][c];if(!p||p.o!==S.turn)return[];return reach(S.B,r,c).filter(([a,b])=>!inCheck(doMove(S,{fr:r,fc:c,tr:a,tc:b}),S.turn))}
// 持ち駒を打てるか（二歩・行き所のない駒・打ち歩詰めは禁止）
function dropOK(S,t,r,c,inner){const o=S.turn;if(S.B[r][c])return false;
  if((t==='FU'||t==='KY')&&far(o,r)===0||t==='KE'&&far(o,r)<=1)return false;
  if(t==='FU')for(let i=0;i<9;i++){const q=S.B[i][c];if(q&&q.o===o&&q.t==='FU'&&!q.pr)return false}
  const N=doMove(S,{drop:t,tr:r,tc:c});if(inCheck(N,o))return false;
  if(t==='FU'&&!inner&&inCheck(N,1-o)&&!anyMove(N,true))return false;
  return true}
function dropsOf(S,t){const out=[];if(!S.H[S.turn][t])return out;for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(dropOK(S,t,r,c))out.push([r,c]);return out}
function anyMove(S,inner){for(let r=0;r<9;r++)for(let c=0;c<9;c++){const p=S.B[r][c];if(p&&p.o===S.turn&&movesFrom(S,r,c).length)return true}
  for(const t in S.H[S.turn])for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(dropOK(S,t,r,c,inner))return true;return false}
function start(){const B=Array.from({length:9},()=>Array(9).fill(null)),back=['KY','KE','GI','KI','OU','KI','GI','KE','KY'];
  for(let c=0;c<9;c++){B[0][c]={t:back[c],o:1,pr:false};B[8][c]={t:back[c],o:0,pr:false};B[2][c]={t:'FU',o:1,pr:false};B[6][c]={t:'FU',o:0,pr:false}}
  B[1][1]={t:'HI',o:1,pr:false};B[1][7]={t:'KA',o:1,pr:false};B[7][1]={t:'KA',o:0,pr:false};B[7][7]={t:'HI',o:0,pr:false};return{B,H:[{},{}],turn:0}}
const posKey=S=>S.turn+S.B.map(row=>row.map(p=>p?(p.o?'v':'^')+p.t+(p.pr?'+':''):'.').join('')).join('/')+JSON.stringify(S.H.map(h=>HAND.map(t=>h[t]||0)));
// 棋譜の1手（▲７六歩・△同　角成・▲５五角打 など）
const ZEN='０１２３４５６７８９',KAN=['','一','二','三','四','五','六','七','八','九'];
function moveText(S,m,prev){const o=S.turn,dest=prev&&prev.tr===m.tr&&prev.tc===m.tc?'同　':ZEN[9-m.tc]+KAN[m.tr+1];
  if(m.drop)return(o?'△':'▲')+dest+NAME[m.drop]+'打';
  const p=S.B[m.fr][m.fc],nm=p.t==='OU'?(o?'王':'玉'):p.pr?KNAME[p.t]:NAME[p.t];
  return(o?'△':'▲')+dest+nm+(m.pro?'成':canPro(p,m.fr,m.tr)&&!mustPro(p,m.tr)?'不成':'')}

// ================= 対局の状態（保存して、つづきから遊べる） =================
const SAVE='shogi2p-save';
let moves=[],resigned=null,face=false,S=start(),texts=[],over=null,sel=null,pend=null,overShown=false;
try{const o=JSON.parse(localStorage.getItem(SAVE));if(o&&Array.isArray(o.moves)){moves=o.moves;resigned=o.resigned==null?null:o.resigned;face=!!o.face;if(o.cpu){CPU.on=!!o.cpu.on;CPU.side=o.cpu.side?1:0;CPU.lv=Math.max(0,Math.min(2,o.cpu.lv|0))}}}catch(e){}
function save(){if(NET.on)return;try{localStorage.setItem(SAVE,JSON.stringify({moves,resigned,face,cpu:{on:CPU.on,side:CPU.side,lv:CPU.lv}}))}catch(e){}}
// はじめから手を並べ直して、今の局面・棋譜・勝ち負けを出す
function replay(){S=start();texts=[];const seen={};seen[posKey(S)]=1;let rep=false;
  for(let i=0;i<moves.length;i++){const m=moves[i];texts.push(moveText(S,m,moves[i-1]));S=doMove(S,m);const k=posKey(S);seen[k]=(seen[k]||0)+1;if(seen[k]>=4)rep=true}
  over=null;
  if(resigned!=null)over={type:'resign',win:1-resigned};
  else if(!anyMove(S))over={type:inCheck(S,S.turn)?'mate':'stuck',win:1-S.turn};
  else if(rep)over={type:'draw'}}
function play(m){moves.push(m);resigned=null;sel=null;pend=null;overShown=false;replay();save();tick();draw();if(NET.on)netSend();cpuCheck()}

// ================= 画面 =================
function komaSvg(p){const t=p.t==='OU'?(p.o?'王':'玉'):p.pr?PNAME[p.t]:NAME[p.t];
  return `<svg viewBox="0 0 100 110"><path d="M50 4 83 17 94 106 6 106 17 17Z" fill="#f5e7c6" stroke="#6b5a3c" stroke-width="3" stroke-linejoin="round"/>`+
    `<text x="50" y="${p.t==='OU'||p.t==='HI'||p.t==='KA'?76:78}" text-anchor="middle" font-size="${p.t==='OU'?54:58}" fill="${p.pr?'#b3241b':'#1c1a16'}" font-family="Hiragino Mincho ProN,Yu Mincho,YuMincho,Noto Serif JP,serif" font-weight="${p.t==='OU'?700:500}">${t}</text></svg>`}
const board=$('board'),sqs=[];
for(let r=0;r<9;r++)for(let c=0;c<9;c++){const d=document.createElement('div');d.className='sq';d.addEventListener('pointerdown',e=>{e.preventDefault();tap(r,c)});board.appendChild(d);sqs.push(d)}
// 星（3筋と6筋・3段と6段の交点）
for(const [r,c] of[[3,3],[3,6],[6,3],[6,6]]){const d=document.createElement('i');d.className='dot';d.style.left=(c/9*100)+'%';d.style.top=(r/9*100)+'%';board.appendChild(d)}
board.style.position='relative';
$('files').innerHTML=[9,8,7,6,5,4,3,2,1].map(n=>`<span>${n}</span>`).join('');
$('ranks').innerHTML=KAN.slice(1).map(k=>`<span>${k}</span>`).join('');
function draw(){const last=moves[moves.length-1],chk=!over&&inCheck(S,S.turn)?kingAt(S.B,S.turn):null,tg=sel?sel.tg:[];
  for(let r=0;r<9;r++)for(let c=0;c<9;c++){const d=sqs[r*9+c],p=S.B[r][c],isT=tg.some(([a,b])=>a===r&&b===c);
    const cls='sq'+(p&&p.o===1?' g':'')+(last&&(last.tr===r&&last.tc===c||!last.drop&&last.fr===r&&last.fc===c)?' last':'')+(sel&&sel.type==='b'&&sel.r===r&&sel.c===c?' sel':'')+(chk&&chk[0]===r&&chk[1]===c?' chk':'')+(isT?' tg':'')+(isT&&p?' cap':'');
    if(d.className!==cls)d.className=cls;const key=p?p.o+p.t+p.pr:'';if(d.dataset.k!==key){d.dataset.k=key;d.innerHTML=p?komaSvg(p):''}}

    moves=[];resigned=null;sel=null;pend=null;overShown=false;['over','cdlg'].forEach(i=>$(i).classList.remove('on'));replay();save();draw();cpuCheck()};if(moves.length&&!over){$('cdlg').classList.remove('on');ask('いまの対局をやめて、この相手と最初から指しますか？',go)}else go()});

window.__S={CPU,cpuCheck,NET,netHost,netJoin,netRooms,openNet,netAgain,_t:{start,doMove,dropOK,anyMove,inCheck,movesFrom,dropsOf,moveText,copy},get S(){return S},get moves(){return moves},get over(){return over},play,movesFrom:(r,c)=>movesFrom(S,r,c),dropsOf:t=>dropsOf(S,t),tap,tapHand,texts:()=>texts};

/* ===================== online chat (only while you are in an online room) =====================
   Messages travel in your presence in the game's room: your last three as [number, text] under `ocm`,
   your name under `ocn`. A newcomer's old lines are not shown. T or Enter (PC) or 💬 opens it. */
const OCHAT = (() => {
  const S = { seq: 0, out: [], seen: {}, open: false, room: null, opt: null, el: {}, lines: [] };
  const clean = v => String(v == null ? '' : v).replace(/[\u0000-\u001f\u007f-\u009f​-‏‪-‮⁠-⁯﻿]/g, '').trim();
  const CSS = `
#ochat{position:absolute;inset:0;pointer-events:none;z-index:40;font-family:"Noto Sans JP",system-ui,sans-serif;display:none}
#ochat.on{display:block}
#ochatB{position:absolute;right:calc(env(safe-area-inset-right,0px) + 66px);top:calc(env(safe-area-inset-top,0px) + 12px);width:42px;height:38px;border-radius:10px;border:2px solid rgba(255,255,255,.7);background:rgba(10,12,20,.72);color:#fff;font-size:19px;line-height:1;pointer-events:auto;cursor:pointer;padding:0}
#ochatB.new{box-shadow:0 0 0 3px #ffd34d}
#ochatLog{position:absolute;left:calc(env(safe-area-inset-left,0px) + 10px);top:calc(env(safe-area-inset-top,0px) + 118px);width:min(420px,60vw);display:flex;flex-direction:column;gap:3px}
#ochatLog div{background:rgba(0,0,0,.55);color:#fff;padding:3px 9px;border-radius:6px;font-size:14px;line-height:1.45;text-shadow:0 1px 2px #000;word-break:break-all;transition:opacity .5s}
#ochatLog b{margin-right:4px}
#ochatBox{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);width:min(520px,94%);display:none;gap:6px;pointer-events:auto;background:rgba(16,18,28,.94);border:2px solid rgba(255,255,255,.6);border-radius:10px;padding:8px;flex-wrap:wrap}
#ochat.open #ochatBox{display:flex}
#ochat.open #ochatLog div{opacity:1!important}
#ochatIn{flex:1;min-width:0;font-size:16px;padding:7px 9px;border-radius:7px;border:1px solid #888;background:#0b0c12;color:#fff;outline:none;-webkit-user-select:text;user-select:text}
#ochatBox button{font-size:15px;padding:6px 12px;border-radius:7px;border:1px solid #888;background:#2a3050;color:#fff;cursor:pointer}
#ochatQ{display:flex;flex-wrap:wrap;gap:5px;width:100%}
#ochatQ button{font-size:13px;padding:4px 10px;background:#1c2034}`;
  const QUICK = ['よろしく！', 'こっち！', 'まって！', 'ありがとう', 'ナイス！', 'にげて！'];
  function el(tag, attrs, parent) { const e = document.createElement(tag); Object.assign(e, attrs || {}); if (parent) parent.appendChild(e); return e; }
  function mount(opt) {
    S.opt = opt;
    const st = el('style', { textContent: CSS + (opt.css || '') }); document.head.appendChild(st);   // (opt.css: where this game has room for it)
    const w = S.el.w = el('div', { id: 'ochat' });
    S.el.log = el('div', { id: 'ochatLog' }, w);
    const b = S.el.b = el('button', { id: 'ochatB', textContent: '💬', title: 'チャット（T）' }, w);
    const box = el('div', { id: 'ochatBox' }, w);
    const inp = S.el.inp = el('input', { id: 'ochatIn', maxLength: 60, placeholder: 'メッセージ', autocomplete: 'off', enterKeyHint: 'send' }, box);
    el('button', { textContent: '送信', onclick: e => { e.stopPropagation(); send(inp.value); inp.value = ''; close(); } }, box);
    el('button', { textContent: '×', onclick: e => { e.stopPropagation(); close(); } }, box);
    const q = el('div', { id: 'ochatQ' }, box);
    for (const t of QUICK) el('button', { textContent: t, onclick: e => { e.stopPropagation(); send(t); close(); } }, q);
    const stop = e => e.stopPropagation();
    for (const ev of ['mousedown', 'mouseup', 'click', 'touchstart', 'touchend', 'pointerdown', 'pointerup', 'wheel']) box.addEventListener(ev, stop, { passive: true });
    b.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); toggle(); }, { passive: false });
    b.addEventListener('click', e => { e.stopPropagation(); toggle(); });
    b.addEventListener('mousedown', stop);
    // while typing, the game does not see the keys
    addEventListener('keydown', e => {
      if (document.activeElement === inp) {
        e.stopPropagation();
        if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); send(inp.value); inp.value = ''; close(); }
        else if (e.key === 'Escape') { e.preventDefault(); close(); }
        return;
      }
      const ae = document.activeElement;   // (typing in another box: Enter is theirs)
      if (S.room && !S.open && !e.repeat && !(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) && ((opt.noT ? false : e.code === 'KeyT') || (e.code === 'Enter' && opt.enterOpens)) && (!opt.canOpen || opt.canOpen())) { e.preventDefault(); e.stopPropagation(); open(); }
    }, true);
    addEventListener('keyup', e => { if (document.activeElement === inp) e.stopPropagation(); }, true);
    addEventListener('keypress', e => { if (document.activeElement === inp) e.stopPropagation(); }, true);
    (opt.parent && opt.parent() || document.body).appendChild(w);
    setInterval(tick, 250);
  }
  function tick() {
    let r = null; try { r = S.opt.room(); } catch (e) { r = null; }
    if (r !== S.room) { S.room = r; S.seen = {}; S.out = []; if (!r && S.open) close(); }
    S.el.w.classList.toggle('on', !!r);
    const now = performance.now();
    for (const L of S.lines.slice()) { const age = (now - L.t) / 1000; if (age > 12 && !S.open) { L.d.remove(); S.lines.splice(S.lines.indexOf(L), 1); } else L.d.style.opacity = S.open ? 1 : Math.min(1, 12 - age); }
    if (!r) return;
    let ps = []; try { ps = r.peers(); } catch (e) { ps = []; }
    for (const p of ps) if (p && !p.sameTab && p.kind === 'viewer') read(p.peer, p.presence);
  }
  function read(peer, pr) {
    const cm = pr && pr.ocm;
    if (!Array.isArray(cm)) { if (!(peer in S.seen)) S.seen[peer] = 0; return; }   // (nothing said yet: whatever they say next is new)
    const top = cm.reduce((m, e) => (Array.isArray(e) && e[0] > m ? e[0] : m), -1);
    if (!(peer in S.seen)) { S.seen[peer] = top; return; }
    for (const e of cm) {
      if (!Array.isArray(e) || !(e[0] > S.seen[peer])) continue;
      S.seen[peer] = e[0]; const t = clean(e[1]).slice(0, 60);
      if (t) { line(clean(pr.ocn).slice(0, 14) || '???', t, false); if (!S.open) S.el.b.classList.add('new'); }
    }
  }
  function line(name, text, mine) {
    const d = el('div', {}, S.el.log), n = el('b', { textContent: name ? name + '：' : '' }, d); n.style.color = mine ? '#8fc4ff' : '#ffb07a';
    d.appendChild(document.createTextNode(text));
    S.lines.push({ d, t: performance.now() });
    while (S.lines.length > 7) S.lines.shift().d.remove();
    if (S.opt.sound) try { S.opt.sound(mine); } catch (e) { /* no sound */ }
  }
  // presence is small (4 KiB for everything the game keeps there too): at most two lines, taken out again after a while
  function send(t) {
    t = clean(t).slice(0, S.opt.max || 60); if (!t || !S.room) return;
    const room = S.room, nm = clean(S.opt.name()).slice(0, 12) || 'プレイヤー';
    S.seq++; S.out.push([S.seq, t]); if (S.out.length > 2) S.out.shift();
    line(nm, t, true);
    const put = list => room.presence({ ocm: list, ocn: nm });
    try { put(S.out.slice()).catch(() => put(S.out.slice(-1)).catch(() => line('', '（送れませんでした）', true))); } catch (e) { /* not sent */ }
    clearTimeout(S.clearT);
    S.clearT = setTimeout(() => { S.out = []; if (S.room === room) try { room.presence({ ocm: null, ocn: null }).catch(() => {}); } catch (e) { /* gone */ } }, 8000);
  }
  function open() {
    if (!S.room || S.open) return;
    S.open = true; S.el.w.classList.add('open'); S.el.b.classList.remove('new');
    if (S.opt.onOpen) try { S.opt.onOpen(); } catch (e) { /* game hook */ }
    if (document.pointerLockElement) try { document.exitPointerLock(); } catch (e) { /* not locked */ }
    try { S.el.inp.focus(); } catch (e) { /* no focus */ }
  }
  function close() {
    if (!S.open) return;
    S.open = false; S.el.w.classList.remove('open');
    try { S.el.inp.blur(); } catch (e) { /* no focus */ }
    if (S.opt.onClose) try { S.opt.onClose(); } catch (e) { /* game hook */ }
  }
  const toggle = () => (S.open ? close() : open());
  return { mount, open, close, get isOpen() { return S.open; }, _S: S };
})();

OCHAT.mount({ room: () => (NET.on ? NET.game : null), name: () => myName(), parent: () => document.body, enterOpens: true });

})();

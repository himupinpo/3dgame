<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>まんぷくレストラン</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap">
<style>
/* まんぷくレストラン：画面の文字・ボタン */
:root { --ink: #3a2a1e; --cream: #fff8ec; --tom: #e8523a; --org: #ff9a2a; --teal: #2aa89a; --gold: #f2b62a; --panel: rgba(255, 250, 240, .97); --line: #e8d6b8;
  --f: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; --opa: .55; --bs: 1; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #f6e8d2; color: var(--ink); overflow: hidden; font-family: var(--f); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; overscroll-behavior: none; }
#rot { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; transform-origin: 0 0; overflow: hidden; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.hud { position: absolute; display: none; pointer-events: none; }
body.playing .hud { display: block; }
body.cooking .hud, body.cooking .tb, body.cooking #joy, body.building #joy, body.building .tb, body.building #side, body.building #feed, body.building #prompt { display: none !important; }
button { font-family: var(--f); }
/* 上のバー：お金・レベル・評判・日にち・時計 */
#top { left: 0; right: 0; top: 0; padding: calc(8px + env(safe-area-inset-top, 0px)) calc(10px + env(safe-area-inset-right, 0px)) 0 calc(10px + env(safe-area-inset-left, 0px)); display: none; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none; }
body.playing #top { display: flex; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 20px; background: rgba(255,250,240,.93); box-shadow: 0 2px 6px rgba(80,50,20,.18); font-weight: 900; font-size: 15px; pointer-events: auto; }
.chip em { font-style: normal; font-size: 17px; }
#mon { color: #1e7a3a; } #lvBar { width: 64px; height: 7px; border-radius: 4px; background: #eadcc4; overflow: hidden; } #lvBar i { display: block; height: 100%; background: linear-gradient(90deg, var(--org), var(--gold)); }
#stars { color: var(--gold); letter-spacing: -1px; } #stars small { color: var(--ink); font-size: 12px; margin-left: 3px; letter-spacing: 0; }
#openB { cursor: pointer; border: none; } #openB.open { background: #2aa86a; color: #fff; } #openB.closed { background: #6a5a4a; color: #fff; }
#spdB { cursor: pointer; border: none; }
/* 右のボタン */
#side { position: absolute; right: calc(10px + env(safe-area-inset-right, 0px)); top: calc(60px + env(safe-area-inset-top, 0px)); display: none; flex-direction: column; gap: 7px; }
body.playing #side { display: flex; }
.sb { width: 58px; height: 58px; border-radius: 16px; border: none; background: var(--panel); box-shadow: 0 3px 8px rgba(80,50,20,.22); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 22px; line-height: 1; color: var(--ink); position: relative; }
.sb small { font-size: 10px; font-weight: 800; margin-top: 3px; } .sb .dot { position: absolute; right: 4px; top: 4px; width: 11px; height: 11px; border-radius: 50%; background: var(--tom); display: none; } .sb.alert .dot { display: block; }
/* お知らせ（左下） */
#feed { left: calc(10px + env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: min(330px, 60vw); display: none; flex-direction: column; gap: 4px; }
body.playing #feed { display: flex; }
#feed div { padding: 5px 10px; border-radius: 10px; background: rgba(255,250,240,.9); font-size: 12.5px; font-weight: 700; box-shadow: 0 1px 4px rgba(80,50,20,.15); animation: fin .3s; } #feed div b { color: var(--tom); }
@keyframes fin { from { opacity: 0; transform: translateX(-10px); } }
#prompt { left: 50%; bottom: calc(120px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 7px 16px; border-radius: 20px; background: rgba(58,42,30,.85); color: #fff; font-weight: 800; font-size: 14px; white-space: nowrap; display: none !important; }
body.playing #prompt.on { display: block !important; } body.cooking #prompt.on, body.building #prompt.on { display: none !important; }
#prompt b { color: var(--gold); }
#toast { left: 50%; top: 22%; transform: translateX(-50%); padding: 10px 22px; border-radius: 22px; background: rgba(255,250,240,.96); box-shadow: 0 4px 16px rgba(80,50,20,.3); font-weight: 900; font-size: 18px; opacity: 0; transition: opacity .3s; white-space: nowrap; text-align: center; }
#toast small { display: block; font-size: 12px; font-weight: 700; }
/* スマホ：スティック・ボタン */
#joy { position: absolute; left: calc(24px + env(safe-area-inset-left, 0px)); bottom: calc(110px + env(safe-area-inset-bottom, 0px)); width: calc(120px * var(--bs)); height: calc(120px * var(--bs)); border-radius: 50%; display: none; background: rgba(255,250,240,calc(var(--opa) * .5)); border: 3px solid rgba(255,255,255,calc(var(--opa) * 1.3)); touch-action: none; }
body.touch.playing #joy { display: block; }
#joyK { position: absolute; left: 50%; top: 50%; width: 46%; height: 46%; margin: -23% 0 0 -23%; border-radius: 50%; background: rgba(255,154,42,calc(var(--opa) * 1.3)); }
.tb { position: absolute; display: none; align-items: center; justify-content: center; text-align: center; font: 900 calc(14px * var(--bs)) var(--f); color: #fff; border-radius: 50%; background: rgba(232,82,58,calc(var(--opa) * 1.4)); border: 3px solid rgba(255,255,255,.8); touch-action: none; pointer-events: auto; box-shadow: 0 3px 8px rgba(80,30,10,.3); }
body.touch.playing .tb { display: flex; }
.tb.on { transform: scale(.94); filter: brightness(1.15); }
#bAct { width: calc(84px * var(--bs)); height: calc(84px * var(--bs)); right: calc(22px + env(safe-area-inset-right, 0px)); bottom: calc(40px + env(safe-area-inset-bottom, 0px)); }
#bRun { width: calc(56px * var(--bs)); height: calc(56px * var(--bs)); right: calc(118px * var(--bs) + 20px + env(safe-area-inset-right, 0px)); bottom: calc(36px + env(safe-area-inset-bottom, 0px)); background: rgba(42,168,154,calc(var(--opa) * 1.4)); font-size: calc(12px * var(--bs)); }
#tArea { position: absolute; inset: 0; display: none; }
body.touch.playing #tArea { display: block; }
/* 建築モード */
#build { position: absolute; left: 0; right: 0; bottom: 0; display: none; background: var(--panel); box-shadow: 0 -4px 14px rgba(80,50,20,.25); border-radius: 18px 18px 0 0; padding: 8px calc(10px + env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) calc(10px + env(safe-area-inset-left, 0px)); }
body.building #build { display: block; }
#bTabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; } #bTabs::-webkit-scrollbar { display: none; }
#bTabs button, .pill { flex: none; padding: 6px 12px; border-radius: 16px; border: 2px solid var(--line); background: #fff; font-weight: 800; font-size: 13px; cursor: pointer; color: var(--ink); }
#bTabs button.on, .pill.on { background: var(--org); border-color: var(--org); color: #fff; }
#bItems { display: flex; gap: 7px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: thin; }
.card { flex: none; width: 96px; border-radius: 12px; border: 2px solid var(--line); background: #fff; padding: 5px; cursor: pointer; text-align: center; font-size: 11.5px; font-weight: 800; position: relative; }
.card canvas, .card .sw { width: 82px; height: 58px; border-radius: 8px; display: block; margin: 0 auto 3px; background: #f4ead8; }
.card .pr { color: #1e7a3a; font-weight: 900; } .card.on { border-color: var(--org); box-shadow: 0 0 0 2px var(--org); } .card.lock { opacity: .45; } .card.lock .pr { color: #a04a3a; }
#bBar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
#bBar .bt { padding: 7px 12px; border-radius: 12px; border: none; background: #fff; box-shadow: 0 1px 4px rgba(80,50,20,.2); font-weight: 900; font-size: 13px; cursor: pointer; }
#bBar .bt.main { background: var(--teal); color: #fff; } #bBar .bt.red { background: var(--tom); color: #fff; }
#bInfo { flex: 1; min-width: 120px; font-size: 12.5px; font-weight: 700; }
#bCols { display: flex; gap: 4px; } #bCols i { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #bbb; cursor: pointer; display: inline-block; } #bCols i.on { box-shadow: 0 0 0 3px var(--org); }
#bMsg { position: absolute; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); padding: 6px 16px; border-radius: 16px; background: rgba(58,42,30,.85); color: #fff; font-weight: 800; font-size: 13px; display: none; white-space: nowrap; }
body.building #bMsg { display: block; }
/* パネル（メニュー・スタッフなど） */
.scr { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 12px; background: rgba(60,40,20,.35); overflow: auto; z-index: 5; }
.scr.on { display: flex; }
.box { width: min(640px, 100%); max-height: 100%; overflow: auto; padding: 16px 16px 14px; border-radius: 18px; background: var(--panel); box-shadow: 0 10px 40px rgba(60,30,10,.35); }
.box h2 { margin: 0 0 8px; font-size: 21px; font-weight: 900; display: flex; align-items: center; gap: 8px; } .box h2 .x { margin-left: auto; width: 34px; height: 34px; border-radius: 50%; border: none; background: #f0e2c8; font-size: 18px; cursor: pointer; }
.box p { font-size: 13.5px; line-height: 1.6; margin: 5px 0; }
.row { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 12px; background: #fff; border: 1px solid var(--line); margin: 6px 0; font-size: 13.5px; }
.row .ic { width: 48px; height: 48px; border-radius: 10px; flex: none; background: #f4ead8; display: flex; align-items: center; justify-content: center; font-size: 26px; overflow: hidden; }
.row .ic canvas { width: 48px; height: 48px; }
.row .tx { flex: 1; min-width: 0; } .row .tx b { font-size: 14.5px; } .row .tx small { display: block; color: #7a6a5a; font-weight: 700; font-size: 11.5px; line-height: 1.45; }
.row .r { text-align: right; font-weight: 900; }
.btn { display: inline-block; padding: 8px 14px; border-radius: 12px; border: none; background: var(--org); color: #fff; font-weight: 900; font-size: 14px; cursor: pointer; box-shadow: 0 2px 0 #c86a10; }
.btn.g { background: var(--teal); box-shadow: 0 2px 0 #1a7a6e; } .btn.r { background: var(--tom); box-shadow: 0 2px 0 #a8321e; } .btn.w { background: #fff; color: var(--ink); box-shadow: 0 2px 0 #d8c8a8; border: 1px solid var(--line); } .btn:disabled { opacity: .45; }
.btn.big { display: block; width: 100%; padding: 13px; font-size: 17px; margin: 8px 0; }
.tabs { display: flex; gap: 5px; margin: 4px 0 8px; flex-wrap: wrap; }
input[type=range] { accent-color: var(--org); } input[type=text] { font: 800 16px var(--f); padding: 8px 10px; border-radius: 10px; border: 2px solid var(--line); width: 100%; color: var(--ink); }
textarea { width: 100%; height: 90px; font: 12px monospace; border-radius: 10px; border: 2px solid var(--line); padding: 6px; }
.bar2 { height: 8px; border-radius: 4px; background: #eadcc4; overflow: hidden; } .bar2 i { display: block; height: 100%; background: var(--teal); }
.stat2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; } .stat2 div { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; font-size: 13px; font-weight: 800; } .stat2 div b { display: block; font-size: 19px; color: var(--tom); }
.rev { background: #fff; border-radius: 10px; border: 1px solid var(--line); padding: 7px 10px; margin: 5px 0; font-size: 12.5px; } .rev b { color: var(--gold); }
/* タイトル */
#title { background: radial-gradient(ellipse at 50% 30%, rgba(255,240,210,.6), rgba(120,70,30,.55)); }
#title h1 { margin: 0; text-align: center; font-size: clamp(36px, 9vw, 58px); font-weight: 900; color: var(--tom); text-shadow: 0 3px 0 #fff, 0 6px 0 rgba(160,60,20,.3); letter-spacing: .04em; }
#title .tag { text-align: center; font-weight: 800; margin: 2px 0 12px; color: #7a4a2a; }
.slot { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 14px; background: #fff; border: 2px solid var(--line); margin: 7px 0; cursor: pointer; } .slot:hover { border-color: var(--org); }
.slot .n { width: 42px; height: 42px; border-radius: 12px; background: var(--org); color: #fff; font-weight: 900; font-size: 20px; display: flex; align-items: center; justify-content: center; flex: none; }
.slot .tx { flex: 1; } .slot .tx b { font-size: 16px; } .slot .tx small { display: block; color: #7a6a5a; font-weight: 700; }
.theme { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 7px; } .theme button { padding: 10px; border-radius: 12px; border: 2px solid var(--line); background: #fff; cursor: pointer; font-weight: 800; text-align: left; font-size: 13px; color: var(--ink); } .theme button.on { border-color: var(--org); background: #fff3e0; } .theme button em { font-style: normal; font-size: 24px; display: block; }
/* 調理シーン */
#cook { position: absolute; inset: 0; display: none; pointer-events: none; z-index: 4; }
body.cooking #cook { display: block; }
#ckTop { position: absolute; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); text-align: center; padding: 7px 20px; border-radius: 18px; background: rgba(255,250,240,.92); box-shadow: 0 3px 12px rgba(60,30,10,.25); }
#ckName { font-size: 20px; font-weight: 900; } #ckStep { font-size: 13.5px; font-weight: 800; color: #8a5a2a; margin-top: 2px; } #ckProg { width: 220px; height: 6px; border-radius: 3px; background: #eadcc4; margin-top: 5px; overflow: hidden; } #ckProg i { display: block; height: 100%; background: var(--org); width: 0; }
#ckTime { position: absolute; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(420px, 80vw); display: none; pointer-events: auto; text-align: center; }
#ckTime.on { display: block; }
#ckBar { position: relative; height: 26px; border-radius: 13px; background: rgba(255,250,240,.9); box-shadow: 0 3px 10px rgba(60,30,10,.3); overflow: hidden; }
#ckZone { position: absolute; top: 0; bottom: 0; background: rgba(42,168,106,.55); } #ckZone2 { position: absolute; top: 0; bottom: 0; background: rgba(42,168,106,.95); }
#ckCur { position: absolute; top: -3px; bottom: -3px; width: 6px; margin-left: -3px; background: var(--tom); border-radius: 3px; }
#ckHint { font-weight: 900; font-size: 15px; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.6); margin-bottom: 6px; }
#ckTap { margin-top: 8px; padding: 12px 34px; border-radius: 26px; border: none; background: var(--tom); color: #fff; font: 900 18px var(--f); box-shadow: 0 4px 0 #a8321e; cursor: pointer; }
#ckRes { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); font-size: 40px; font-weight: 900; color: #fff; text-shadow: 0 3px 0 var(--tom), 0 0 20px rgba(255,150,60,.8); opacity: 0; transition: opacity .2s, transform .2s; white-space: nowrap; }
#ckSkip { position: absolute; right: calc(14px + env(safe-area-inset-right, 0px)); top: calc(14px + env(safe-area-inset-top, 0px)); pointer-events: auto; padding: 7px 14px; border-radius: 14px; border: none; background: rgba(58,42,30,.7); color: #fff; font: 800 13px var(--f); cursor: pointer; }
#loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f6e8d2; gap: 12px; z-index: 50; }
#loading .pan { width: 64px; height: 64px; border-radius: 50%; border: 10px solid #3a2a1e; border-top-color: var(--org); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#loadmsg { font-weight: 800; }
@media (max-height: 520px) and (min-aspect-ratio: 1/1) { body.playing #side { display: grid; grid-auto-flow: column; grid-template-rows: repeat(4, 48px); direction: rtl; gap: 5px; top: calc(52px + env(safe-area-inset-top, 0px)); } .sb { direction: ltr; } .sb { width: 48px; height: 48px; font-size: 18px; border-radius: 13px; } .sb small { font-size: 9px; margin-top: 1px; } .chip { font-size: 13px; padding: 4px 10px; } }
body.touch #feed { bottom: auto; top: calc(56px + env(safe-area-inset-top, 0px)); width: min(300px, 46vw); }
@media (max-aspect-ratio: 1/1) { #side { top: auto; bottom: calc(200px + env(safe-area-inset-bottom, 0px)); } .sb { width: 50px; height: 50px; font-size: 19px; } #feed { bottom: calc(240px + env(safe-area-inset-bottom, 0px)); } }
</style></head><body>

    case 'curry': plate(); add(new THREE.SphereGeometry(.07, 14, 8, 0, TAU, 0, Math.PI / 2), 0xfbf8f0, -.04, .02, 0); add(new THREE.CylinderGeometry(.08, .09, .015, 16), 0x8a4a1a, .04, .025, 0); add(new THREE.BoxGeometry(.02, .02, .02), 0xe8802a, .05, .04, .02); break;
    case 'omurice': plate(); add(new THREE.SphereGeometry(.09, 16, 10), 0xf6cf4a, 0, .03, 0, { s: [1.3, .5, .85] }); add(new THREE.TorusGeometry(.03, .006, 4, 12), 0xc81e1e, 0, .075, 0, { r: [Math.PI / 2, 0, 0] }); break;
    case 'pancake': plate(); for (let k = 0; k < 3; k++) add(new THREE.CylinderGeometry(.08, .08, .018, 20), 0xd8963a, 0, .03 + k * .019, 0); add(new THREE.BoxGeometry(.03, .02, .03), 0xf8e8a0, 0, .09, 0); break;
    case 'gyoza': plate(); for (let k = 0; k < 5; k++) add(new THREE.SphereGeometry(.03, 10, 6, 0, Math.PI), 0xe8c890, -.08 + k * .04, .02, 0, { s: [1, 1, .7], r: [Math.PI / 2, 0, 0] }); break;
    case 'hamburg': plate(); add(new THREE.SphereGeometry(.07, 14, 8), 0x5a2e1a, 0, .03, 0, { s: [1.2, .45, .9] }); add(new THREE.CylinderGeometry(.06, .07, .005, 14), 0x4a1e10, 0, .06, 0); break;

    case 'smoothie': add(new THREE.CylinderGeometry(.04, .033, .13, 16), 0xf28aa8, 0, .065, 0); add(new THREE.CylinderGeometry(.004, .004, .1, 6), 0xffffff, .015, .14, 0); break;
    case 'parfait': add(new THREE.CylinderGeometry(.045, .025, .16, 16), 0xfff0e0, 0, .08, 0); add(new THREE.SphereGeometry(.045, 12, 8), 0xffffff, 0, .17, 0); add(new THREE.SphereGeometry(.015, 8, 6), 0xd81e2a, 0, .21, 0); break;

    default: plate();

  g.traverse(o => { if (o.isMesh) o.castShadow = true; }); return g;
}

const grp = (x = 0, y = 0, z = 0, p) => { const g = new THREE.Group(); g.position.set(x, y, z); (p || CK.grp).add(g); return g; };

function griddle(x, z, w = .44, d = .32) { const g = grp(x, 0, z); ME(new THREE.BoxGeometry(w, .03, d), fm(0x2a2a2c, { metalness: .7, roughness: .45 }), 0, .015, 0, g); for (const s of [-1, 1]) ME(new THREE.BoxGeometry(w, .02, .01), CKM.steel, 0, .035, s * d / 2, g); return g; }
function charGrill(x, z, w = .44, d = .26) { const g = grp(x, 0, z); ME(new THREE.BoxGeometry(w + .04, .08, d + .04), fm(0x3a3a3e, { metalness: .6, roughness: .5 }), 0, .04, 0, g);
  const cm = new THREE.MeshStandardMaterial({ map: CKM.coal, emissive: 0xff5a1a, emissiveMap: CKM.coal, emissiveIntensity: 1.3, roughness: 1 }); g.userData.coal = ME(new THREE.BoxGeometry(w, .008, d), cm, 0, .084, 0, g);
  for (let i = 0; i < 13; i++) { const b = ME(new THREE.CylinderGeometry(.0028, .0028, d + .03, 6), CKM.steel, -w / 2 + .015 + i * (w - .03) / 12, .1, 0, g); b.rotation.x = Math.PI / 2; } return g; }
function fryer(x, z, w = .32, d = .24) { const g = grp(x, 0, z), H = .14; for (const [sx, sz, ww, dd] of [[0, -d / 2, w, .012], [0, d / 2, w, .012], [-w / 2, 0, .012, d], [w / 2, 0, .012, d]]) ME(new THREE.BoxGeometry(ww, H, dd), CKM.steel, sx, H / 2, sz, g);
  ME(new THREE.BoxGeometry(w, .01, d), CKM.black, 0, .005, 0, g); const oil = ME(new THREE.BoxGeometry(w - .012, .004, d - .012), CKM.oil, 0, .1, 0, g); oil.castShadow = false; g.userData.oilY = .102; return g; }
function basket(w = .17, d = .15, h = .07) { const g = grp(); const wm = new THREE.MeshStandardMaterial({ color: 0xc8ccd0, metalness: .9, roughness: .3, wireframe: true }); const b = ME(new THREE.BoxGeometry(w, h, d, 9, 4, 8), wm, 0, h / 2, 0, g); b.castShadow = false;
  const hd = ME(new THREE.CylinderGeometry(.006, .006, .2, 8), fm(0x1e1e1e), 0, h + .04, d / 2 + .08, g); hd.rotation.x = 1.15; return g; }
function ladle(r = .035) { const g = grp(); const b = ME(new THREE.SphereGeometry(r, 18, 10, 0, TAU, Math.PI / 2, Math.PI / 2), CKM.steel, 0, 0, 0, g); b.material = CKM.steel; b.material.side = THREE.DoubleSide;
  const h = ME(new THREE.CylinderGeometry(.0045, .0045, .3, 8), CKM.steel, 0, .13, -r - .05, g); h.rotation.x = -.4; g.userData.r = r; return g; }
function spatula() { const g = grp(); ME(new THREE.BoxGeometry(.09, .003, .08), CKM.steel, 0, 0, 0, g); const h = ME(new THREE.CylinderGeometry(.007, .007, .16, 8), fm(0x2a1e18), 0, .045, .1, g); h.rotation.x = 1.0; return g; }
function wok(x, z, r = .17) { const g = grp(x, 0, z); const pts = []; for (let i = 0; i <= 14; i++) { const a = i / 14 * 1.15; pts.push(new THREE.Vector2(Math.sin(a) * r + (i === 14 ? .002 : 0), (1 - Math.cos(a)) * r * .9)); } pts.unshift(new THREE.Vector2(0, 0));
  ME(new THREE.LatheGeometry(pts, 40), new THREE.MeshStandardMaterial({ color: 0x34302c, metalness: .8, roughness: .32, side: THREE.DoubleSide }), 0, .03, 0, g); const h = ME(new THREE.CylinderGeometry(.009, .009, .2, 8), fm(0x3a2a1e), r + .08, .03 + r * .5, 0, g); h.rotation.z = Math.PI / 2 - .2;

// 落ちてのる粒（塩・チーズ・ねぎ…）。親の中の座標で
function bits(o) {
  const L = []; for (let i = 0; i < o.n; i++) { const m = o.mk(i); const a = rr(0, TAU), d = Math.sqrt(Math.random()) * o.r; m.position.set(o.x + Math.cos(a) * d * (o.sx || 1), o.y0 + rr(0, .05), o.z + Math.sin(a) * d * (o.sz || 1)); m.rotation.set(rr(0, TAU), rr(0, TAU), rr(0, TAU)); m.visible = false; (o.p || CK.grp).add(m);
    L.push({ m, v: 0, y1: (o.yf ? o.yf(m.position.x, m.position.z) : o.y1) + rr(0, o.jit || 0), t: -i * (o.gap ?? .015), flat: o.flat }); }
  CK.hooks.push(dt => { for (const b of L) { b.t += dt; if (b.t < 0 || b.done) continue; b.m.visible = true; b.v += 3.2 * dt; b.m.position.y -= b.v * dt; if (b.m.position.y <= b.y1) { b.m.position.y = b.y1; b.done = 1; if (b.flat) b.m.rotation.set(rr(-.25, .25), rr(0, TAU), rr(-.25, .25)); } } });
  return L.map(b => b.m);
}
// ゆっくり出てくる（大きさ 0→1）
